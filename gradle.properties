# Mod
# vvv \t does not format correctly in fabric with ModMenu, nor does leading spaces, so a '| ' prefix is used
mod.authors=swacky
mod.changes=\
  | Fixed Forge crashing on startup in prod\n\
  | Added advancements granting accessory slots capability\n\
  | Allowed accessory type definitions to suggest a number of slots to add\n\
  | Added Figura support\n\
  | Moved accessory type keybinds to a dedicated category, looks nicer imo\n\
  | Added a few more events\n\
  | Added a '/ohmega data' command, primarily for debugging\n\
  | Ported the entire buildscript to Kotlin (much pain)\n\
  | Improved RRV integration performance slightly, will be done more later\n\
  | Split OhmegaHooks class into a common and client variant\n\
  | Eviscerated some miscellaneous creatures (bugs)\n\
  | Add some more events
