# \t does not format correctly in fabric with ModMenu, nor does leading spaces, so a '| ' prefix is used
modChanges=\
  | Added accessory rendering API\n\
  | Added multiple in game commands\n\
  | Switched to menu/screen injection and added creative accessory inventory\n\
  | Allowed accessories to be equipped by any living entity\n\
  | Added initial localisation for Spanish, Italian, Dutch and Russian\n\
  | Added a button to flip the player model in the inventory\n\
  | Added a config screen for Forge\n\
  | Heavily optimised many parts of the mod\n\
  | Supported dispensing accessories onto entities\n\
  | Added built-in screen support for JEI\n\
  | Removed deprecated methods\n\
  | Added accessory types applying attribute modifiers\n\
  | Cleaned up code internally a lot\n\
  | Fixed a few minor bugs\n\
  | Added a fallback "ohmega:none" accessory type\n\
  | Added a one-time Crowdin translation toast on world join\n\
  | General quality of life improvements\n\
  | Added multi-tagged accessory type fallback

