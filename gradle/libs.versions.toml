[libraries]
# Platform
## Common
### Compat
platform-common-compat-rei                    = { group = "me.shedaniel", name = "RoughlyEnoughItems-api", version.ref = "compat-rei" }
platform-common-compat-trinkets               = { group = "eu.pb4", name = "trinkets", version.ref = "compat-trinkets" }

## Fabric
platform-fabric                               = { group = "net.fabricmc", name = "fabric-loader", version.ref = "platform-fabric" }
platform-fabric-dependency-fabricApi          = { group = "net.fabricmc.fabric-api", name = "fabric-api", version.ref = "platform-fabric-dependency-fabricApi" }
platform-fabric-dependency-forgeConfigApiPort = { group = "fuzs.forgeconfigapiport", name = "forgeconfigapiport-fabric", version.ref = "platform-fabric-dependency-forgeConfigApiPort" }
platform-fabric-minecraft                     = { group = "com.mojang", name = "minecraft", version.ref = "minecraft" }
platform-fabric-utility-modMenu               = { group = "com.terraformersmc", name = "modmenu", version.ref = "platform-fabric-utility-modMenu" }

## Forge
platform-forge-eventbusValidator              = { group = "net.minecraftforge", name = "eventbus-validator", version.ref = "platform-forge-eventbusValidator" }

### Compat
platform-fabric-compat-figura                 = { group = "dev.stranik", name = "nofigura-fabric", version.ref = "compat-figura" }
platform-fabric-compat-figura-luaj            = { group = "com.github.FiguraMC.luaj", name = "luaj-core", version.ref = "compat-figura-luaj" }
platform-fabric-compat-polymer                = { group = "eu.pb4", name = "polymer-bundled", version.ref = "compat-polymer" }
platform-fabric-compat-polymer-core           = { group = "eu.pb4", name = "polymer-core", version.ref = "compat-polymer" }
platform-fabric-compat-polymer-resourcePack   = { group = "eu.pb4", name = "polymer-resource-pack", version.ref = "compat-polymer" }
platform-fabric-compat-polymer-sgui           = { group = "eu.pb4", name = "sgui", version.ref = "compat-polymer-sgui" }
platform-fabric-compat-rei                    = { group = "me.shedaniel", name = "RoughlyEnoughItems-fabric", version.ref = "compat-rei" }
platform-fabric-compat-rrv                    = { group = "cc.cassian.rrv", name = "reliable-recipe-viewer-fabric", version.ref = "compat-rrv" }

## Neoforge
### Compat
platform-neoforge-compat-rei                  = { group = "me.shedaniel", name = "RoughlyEnoughItems-api-neoforge", version.ref = "compat-rei" }
platform-neoforge-compat-rrv                  = { group = "cc.cassian.rrv", name = "reliable-recipe-viewer-neoforge", version.ref = "compat-rrv" }


[plugins]
common-utility-modPublish    = { id = "me.modmuss50.mod-publish-plugin", version.ref = "plugin-common-utility-modPublish" }
platform-common-spongeGradle = { id = "org.spongepowered.gradle.vanilla", version.ref = "plugin-platform-common-spongeGradle" }
platform-fabric-loom         = { id = "net.fabricmc.fabric-loom", version.ref = "plugin-platform-fabric-loom" }
platform-forge-fg            = { id = "net.minecraftforge.gradle", version.ref = "plugin-platform-forge-fg" }
platform-neoforge-mdg        = { id = "net.neoforged.moddev", version.ref = "plugin-platform-neoforge-mdg" }

