plugins {
    id "common"
    id "net.neoforged.moddev" version "${pluginNeoV}"
}

version "common+${mcV}"

neoForge {
    neoFormVersion.set "${mcV}-${neoFormV}"

    parchment {
        mappingsVersion.set mapsV
        minecraftVersion.set mapsMcV
    }

    /*runs {
        data {
            //systemProperty "neoforge.enabledGameTestNamespaces", "${modId}"
            //systemProperty "forge.logging.markers", "REGISTRIES"

            ideName.set "Common - ${it.name.capitalize()} (${project.path}"

            data()
            programArguments.addAll "--mod", "${modId}", "--all", "--output", file("src/generated/resources/").getAbsolutePath(), "--existing", file("src/main/resources/").getAbsolutePath()
        }
    }*/
}

dependencies {
    compileOnly group:'org.spongepowered', name:'mixin', version:'0.8.5'
    compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
    annotationProcessor group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
}

configurations {
    commonJava {
        canBeResolved false
        canBeConsumed true
    }

    commonResources {
        canBeResolved false
        canBeConsumed true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.files
}