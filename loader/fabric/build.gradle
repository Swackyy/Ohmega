plugins {
    id "fabric-loom"
    id "loader"
}

version "fabric+${mcV}"

loom {
    accessWidenerPath.set file("src/main/resources/aw.accesswidener")

    mods {
        "${modId}" {
            sourceSet sourceSets.main
            sourceSet project(":loader:common").sourceSets.main
        }
    }

    runs {
        configureEach {
            setConfigName "Fabric ${it.name.capitalize()}"

            runDir = "run"
            ideConfigGenerated = true
        }

        client {
            client()

            programArgs "--username", "Dev"
        }

        server {
            server()
        }
    }
}

remapJar {
    targetNamespace = "named"
}

remapSourcesJar {
    targetNamespace = "named"
}

repositories {
    maven {
        name = "Config API"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven"
    }

    maven {
        name = "ModMenu"
        url = "https://maven.terraformersmc.com/releases"
    }

    maven {
        name = "Parchment"
        url = "https://maven.parchmentmc.org"
    }
}

dependencies {
    commonJava project(path: ":loader:common", configuration: "commonJava")
    commonResources project(path: ":loader:common", configuration: "commonResources")

    minecraft "com.mojang:minecraft:${mcV}"

    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${mapsMcV}:${mapsV}@zip")
    }

    modImplementation "net.fabricmc:fabric-loader:${loaderFabricV}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${loaderFabricApiV}+${mcV}"
    modImplementation "com.terraformersmc:modmenu:${loaderFabricModMenuV}"
    modImplementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${loaderFabricForgeConfigApiPortV}"
}