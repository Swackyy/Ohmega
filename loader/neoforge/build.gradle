plugins {
    id "loader"
    id "net.neoforged.moddev"
}

version "neoforge+${mcV}"

neoForge {
    version = loaderNeoV

    accessTransformers {
        file "src/main/resources/META-INF/accesstransformer.cfg"
    }

    mods {
        "${modId}" {
            sourceSet sourceSets.main
            sourceSet project(":loader:common").sourceSets.main
        }
    }

    parchment {
        mappingsVersion.set mapsV
        minecraftVersion.set mapsMcV
    }

    runs {
        configureEach {
            ideName.set "NeoForge ${it.name.capitalize()} (${project.path})"
            systemProperty "neoforge.enabledGameTestNamespaces", "${modId}"
        }

        client {
            client()
        }

        server {
            server()
        }

        clientData {
            clientData()

            ideName.set "Data Generation"
            programArguments.addAll "--mod", "${modId}", "--all", "--output", project(":loader:common").getDependencyProject().sourceSets.main.resources.getSourceDirectories().getFiles()[1].getAbsolutePath() , "--existing", project(":loader:common").getDependencyProject().sourceSets.main.resources.getSourceDirectories().getFiles()[0].getAbsolutePath()
        }
    }
}

tasks.named("compileTestJava") {
    enabled = false
}