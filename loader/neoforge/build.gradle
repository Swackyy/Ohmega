plugins {
    id "loader"
    id "net.neoforged.moddev"
}

neoForge {
    version = loaderNeoV

    accessTransformers {
        file "src/main/resources/META-INF/accesstransformer.cfg"
    }

    mods {
        "${modId}" {
            sourceSet sourceSets.main
            sourceSet project(":loader:common").sourceSets.main
        }
    }

    runs {
        configureEach {
            ideName.set "NeoForge ${it.name.capitalize()} (${project.path})"
            systemProperty "mixin.debug.export", "true"
            systemProperty "neoforge.enabledGameTestNamespaces", "${modId}"
        }

        register("client") {
            client()
        }

        register("server") {
            server()

            programArgument "--nogui"
        }
    }
}

repositories {
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com"
    }
}

dependencies {
    compileOnly "mezz.jei:jei-${mcVRangeMax}-fabric-api:${jeiV}"
    runtimeOnly "mezz.jei:jei-${mcVRangeMax}-fabric:${jeiV}"
}