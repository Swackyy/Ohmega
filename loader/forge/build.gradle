import net.minecraftforge.renamer.gradle.RenameJar

plugins {
    id "loader"
    id "net.minecraftforge.gradle" version "${pluginForgeV}"
    id 'net.minecraftforge.renamer' version "1.0.6"
}

minecraft {
    mappings channel: "official", version: mcV

    accessTransformer = "META-INF/mapped_at.cfg"

    runs {
        configureEach {
            mods {
                "${modId}" {
                    source sourceSets.main
                    source project(":loader:common").sourceSets.main
                }
            }

            environment "MOD_CLASSES": "{source_roots}"
            renamer.mixin.run it
            systemProperty "eventbus.api.strictRuntimeChecks", "true"
            systemProperty "forge.enabledGameTestNamespaces", modId
            workingDir.convention layout.projectDirectory.dir("run")
        }

        register("client")

        register("server")
    }
}

repositories {
    mavenCentral()
    minecraft.mavenizer it
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven

    maven {
        name = "Forge"
        url = "https://maven.minecraftforge.net"
    }
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${mcV}-${loaderForgeV}")

    implementation "io.github.llamalad7:mixinextras-common:0.5.2"
    annotationProcessor "io.github.llamalad7:mixinextras-common:0.5.2"
    implementation "org.lwjgl:lwjgl-glfw:3.2.2"
    annotationProcessor "org.spongepowered:mixin:0.8.7:processor"
}

renamer.classes(tasks.named("jar", Jar)) {
    map.from minecraft.dependency.toSrgFile
    archiveClassifier.set "intermediate"
}

tasks.named("renameJar", RenameJar) {
    output.set project.layout.buildDirectory.file("libs/${base.archivesName.get()}-${project.version}.jar").get()
    archiveClassifier.set null
}

renamer.enableMixinRefmaps {
    config "${modId}.mixins.json"
    config "${modId}_common.mixins.json"
    mixinMappings.map files(minecraft.dependency.toSrgFile.get())

    defaultObfuscationEnv = "searge"

    source(sourceSets.main) {
        refMap.set "${modId}.refmap.json"
    }

    jar tasks.named("jar")
    jar tasks.named("sourcesJar")
}