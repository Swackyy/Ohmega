plugins {
    id "loader"
    id "net.minecraftforge.gradle"
}

minecraft {
    mappings channel: "official", version: mcV

    accessTransformer = true

    runs {
        configureEach {
            workingDir.convention layout.projectDirectory.dir("run")
            systemProperty "eventbus.api.strictRuntimeChecks", "true"
            systemProperty "forge.enabledGameTestNamespaces", modId
            args "-mixin.config", "${modId}.mixins.json"
            args "-mixin.config", "${modId}_common.mixins.json"
        }

        register("client") {}

        register("server") {}
    }
}

repositories {
    mavenCentral()
    minecraft.mavenizer it
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven

    maven {
        name = "Forge"
        url = "https://maven.minecraftforge.net"
    }
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${mcV}-${loaderForgeV}")

    implementation "io.github.llamalad7:mixinextras-common:0.5.2"
    annotationProcessor "io.github.llamalad7:mixinextras-common:0.5.2"
    annotationProcessor "org.spongepowered:mixin:0.8.7:processor"

/*    implementation("net.sf.jopt-simple:jopt-simple:5.0.4") {
        version {
            strictly "5.0.4"
        }
    }*/
}

jar {
    manifest {
        attributes([
                "MixinConfigs": "${modId}.mixins.json, ${modId}_common.mixins.json"
        ])
    }
}