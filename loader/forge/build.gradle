import net.minecraftforge.renamer.gradle.RenameJar

plugins {
    id "loader"
    id "net.minecraftforge.gradle" version "${pluginForgeV}"
    id 'net.minecraftforge.renamer' version "1.0.2"
}

minecraft {
    mappings channel: "official", version: mcV

    accessTransformer = true

    runs {
        configureEach {
            mods {
                "${modId}" {
                    source sourceSets.main
                    source project(":loader:common").sourceSets.main
                }
            }

            args "-mixin.config", "${modId}.mixins.json"
            args "-mixin.config", "${modId}_common.mixins.json"
            environment "MOD_CLASSES": "{source_roots}"
            systemProperty "eventbus.api.strictRuntimeChecks", "true"
            systemProperty "forge.enabledGameTestNamespaces", modId
            workingDir.convention layout.projectDirectory.dir("run")
        }

        register("client")

        register("server")
    }
}

repositories {
    mavenCentral()
    minecraft.mavenizer it
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven

    maven {
        name = "Forge"
        url = "https://maven.minecraftforge.net"
    }
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${mcV}-${loaderForgeV}")

    implementation "io.github.llamalad7:mixinextras-common:0.5.2"
    annotationProcessor "io.github.llamalad7:mixinextras-common:0.5.2"
    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"
}

tasks.named("jar", Jar) {
    from project.layout.buildDirectory.file("tmp/${modId}.refmap.json")
}

renamer.classes(tasks.named("jar", Jar)) {
    map.from minecraft.dependency.toSrgFile
    archiveClassifier.set "intermediate"
}

tasks.named("renameJar", RenameJar) {
    output.set project.layout.buildDirectory.file("libs/${base.archivesName.get()}-${project.version}.jar").get()
    archiveClassifier.set null
}

tasks.withType(JavaCompile).configureEach {
    String originalPath = minecraft.dependency.toSrgFile.get().canonicalPath
    String extractedPath = originalPath.substring(0, originalPath.lastIndexOf('.'))
    file(extractedPath).text = resources.gzip(originalPath).read().text
    options.compilerArgs.addAll([
            "-AmappingTypes=tsrg",
            "-AdefaultObfuscationEnv=searge",
            "-AreobfTsrgFile=${extractedPath}",
            "-AoutRefMapFile=${project.layout.buildDirectory.file("tmp/${modId}.refmap.json").get().getAsFile().getAbsolutePath()}"
    ])
}

jar {
    manifest {
        attributes([
                "MixinConfigs": "${modId}.mixins.json, ${modId}_common.mixins.json"
        ])
    }
}