plugins {
    id "loader"
    id "net.minecraftforge.gradle"
    id "org.parchmentmc.librarian.forgegradle" version "1.+"
    id "org.spongepowered.mixin" version "0.7.+"
}

mixin {
    config "${modId}.mixins.json"
    config "${modId}_common.mixins.json"
}

minecraft {
    mappings channel: "official", version: mcV

    reobf = false
    accessTransformer = file "src/main/resources/META-INF/accesstransformer.cfg"

    copyIdeResources.set true

    runs {
        configureEach {
            ideaModule = "${rootProject.name}.loader.${project.name}.main"

            workingDirectory file("run")
            property "forge.enabledGameTestNamespaces", "${modId}"
            property "eventbus.api.strictRuntimeChecks", "true"
        }

        client {}

        server {}
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${mcV}-${loaderForgeV}"

    implementation "io.github.llamalad7:mixinextras-common:0.5.2"
    annotationProcessor "io.github.llamalad7:mixinextras-common:0.5.2"

    annotationProcessor "org.spongepowered:mixin:0.8.7:processor"
}

jar {
    manifest {
        attributes([
                "MixinConfigs": "${modId}.mixins.json, ${modId}_common.mixins.json"
        ])
    }
}

sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir

    it.java.destinationDirectory.set dir.get()
}