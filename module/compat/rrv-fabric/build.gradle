plugins {
    id "java-library"
    id "ohmega-compat"
}

repositories {
    maven {
        name = "Cassian"
        url = "https://maven.cassian.cc"
    }

    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net"
    }
}

dependencies {
    // todo: need to split loaders into api module providers
    //compileOnly project(path: ':module:platform:fabric', configuration: "apiElements")
    compileOnly "net.fabricmc.fabric-api:fabric-api:${loaderFabricApiV}+${mcV}"
    compatModuleDependency(it, "util_exclusion-zones")
    compileOnlyApi "cc.cassian.rrv:reliable-recipe-viewer-fabric:${compatRrvV}+${mcV}"
}