modLoader="javafml"
loaderVersion="${platformNeoforgeVersion}"
issueTrackerURL="${modUrlGithub}/issues"
license="${modLicense}"


[[mods]]
modId="ohmega"
version="${modVersion}"
displayName="${modName}"
displayURL="${modUrlGithub}"
iconFile="${modId}.png"
authors="${modAuthors}"
description='''${modDescription}'''


[[mixins]]
config="${modId}_neoforge.mixins.json"

[[mixins]]
config="${modId}_common.mixins.json"

${extraMixinConfigs}

[[dependencies.ohmega]]
modId="neoforge"
type="required"
versionRange="${platformNeoforgeVersionRange}"
ordering="NONE"
side="BOTH"

[[dependencies.ohmega]]
modId="minecraft"
type="required"
versionRange="[${minecraftVersionRangeMin},${minecraftVersionRangeMax}]"
ordering="NONE"
side="BOTH"