pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        mavenCentral()

        maven {
            name = "Fabric"
            url = "https://maven.fabricmc.net"
        }

        maven {
            name = "Forge"
            url = "https://maven.minecraftforge.net"
        }

        maven {
            name = "Parchment"
            url = "https://maven.parchmentmc.org"
        }

        maven {
            name = "Sponge"
            url = "https://repo.spongepowered.org/repository/maven-public"
        }
    }
}

plugins {
    id "org.gradle.toolchains.foojay-resolver-convention" version "1.0.0"
}

rootProject.setName modName

include "loader:common", "loader:fabric", "loader:forge"
