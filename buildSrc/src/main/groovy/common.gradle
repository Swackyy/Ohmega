plugins {
    id "idea"
    id "java"
    id "maven-publish"
    id "signing"
}

group "com.swacky"
version "${project.name}+${mcV}"

base {
    archivesName.set "${modId}-${modV}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(javaV)

    withJavadocJar()
    withSourcesJar()
}

dependencies {
    implementation "org.jspecify:jspecify:1.0.0"
}

processResources {
    var replaceProperties = [
            modId       : modId,
            packFormatV : packFormatV
    ]

    inputs.properties replaceProperties

    filesMatching("pack.mcmeta") {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release.set JavaLanguageVersion.of(javaV).asInt()
}

tasks.withType(Javadoc).configureEach {
    options.quiet()
}

tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}

["apiElements", "runtimeElements", "sourcesElements", "javadocElements"].each { variant ->
    configurations."${variant}".outgoing {
        capability "${group}:${modId}-${project.name}-${mcV}:${version}"
        capability "${group}:${modId}:${version}"
    }

    publishing.publications.configureEach {
        suppressPomMetadataWarningsFor variant
    }
}

File secretsFile = rootProject.file("secrets.properties")

if (secretsFile.exists()) {
    secretsFile.withInputStream { stream ->
        {
            Properties secrets = new Properties()

            secrets.load(stream)
            secrets.forEach {
                key, value -> project.ext.set((String) key, value)
            }
        }
    }

    publishing {
            publications {
                register("mavenJava", MavenPublication) {
                    groupId = "io.github.swackyy"
                    artifactId = "${modId}-${project.name}"
                    version = "${modV}-mc${mcV}"
                    
                    if (project.name == "fabric") {
                        artifact tasks.named("remapJar")
                    } else {
                        artifact tasks.named("jar")
                    }

                    artifact tasks.named("javadocJar")
                    artifact tasks.named("sourcesJar")

                    pom {
                        name = "${modName} ${project.name}"
                        description = modSummary
                        url = gitUrl

                        licenses {
                            //noinspection GroovyAssignabilityCheck
                            license {
                                name = license
                            }
                        }

                        scm {
                            url = "github.com"
                            connection = "scm:git:git:github.com"
                            developerConnection = "scm:git:ssh://github.com"
                        }

                        developers {
                            developer {
                                id = "swackyy"
                                name = modAuthorsDisplay
                                email = "68652827+Swackyy@users.noreply.github.com"
                            }
                        }
                    }
                }
            }

            repositories {
                maven {
                    name = "Maven"
                    url = "https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/"

                    credentials {
                        username = getProperty("secretsMavenCentralUsername")
                        password = getProperty("secretsMavenCentralPassword")
                    }
                }
            }
        }

    plugins.withType(MavenPublishPlugin).configureEach {
        signing {
            String id = findProperty("secretsSigningId")
            String key = findProperty("secretsSigningKey")
            String password = findProperty("secretsSigningPassword")

            if (id && key && password) {
                useInMemoryPgpKeys(id, key, password)
                sign publishing.publications.mavenJava
            } else {
                System.err.println "Could not sign project ${project.name}"
                required = false
            }
        }
    }
}