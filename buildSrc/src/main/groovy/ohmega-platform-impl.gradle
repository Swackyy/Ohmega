plugins {
    id "ohmega-platform"
}

dependencies {
    apiModuleDependency it, apiProject()
}

tasks.withType(JavaCompile).configureEach {
    classpath += apiProject().sourceSets.main.output
}

Project apiProject() {
    Project parent = project.parent

    return parent.project("${parent.name}-api")
}

ext.apiProject = this.&apiProject