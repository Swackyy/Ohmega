plugins {
    id "ohmega-module"
    id "maven-publish"
    id "signing"
}

base {
    archivesName.set "${modId}-${project.name}"
}

tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}

tasks.named ("javadocJar", Jar) {
    archiveClassifier = "javadoc-unused"
}

tasks.register ("pseudoJavadocJar", Jar) {
    archiveClassifier = "javadoc"
}

processResources {
    LinkedHashMap<String, String> replacements = [
            modId          : modId,
            packFormatMaxV : packFormatMaxV,
            packFormatMinV : packFormatMinV
    ]

    inputs.properties replacements

    filesMatching (["pack.mcmeta", "resourcepacks/*/pack.mcmeta"]) {
        expand replacements
    }
}

if (rootProject.file("secrets.properties").exists()) {
    afterEvaluate {
        publishing {
            repositories {
                maven {
                    name = "Novatores"
                    url = "https://maven.novatores.net"

                    credentials {
                        username = getProperty "secretsNovatoresUsername"
                        password = getProperty "secretsNovatoresPassword"
                    }
                }
            }

            publications {
                maven (MavenPublication) {
                    groupId = "com.swacky"
                    artifactId = base.archivesName.get()

                    from components.java
                    artifact tasks.named("pseudoJavadocJar")

                    artifacts.removeAll { artifact ->
                        artifact.classifier == "javadoc-unused"
                    }

                    pom {
                        name = "${modName} ${project.name.capitalize()}"
                        description = modSummary
                        url = gitUrl

                        withXml {
                            Object dependencies = asNode().dependencies[0]

                            if (dependencies != null) {
                                List targets = dependencies.dependency.findAll { dep ->
                                    String groupId = dep.groupId.text()
                                    String artifactId = dep.artifactId.text()

                                    return groupId.contains("fabricmc")                  ||
                                           artifactId.contains("jei")                    ||
                                           groupId.contains("minecraftforge")            ||
                                           artifactId.contains("modmenu")                ||
                                           artifactId.contains("polymer")                ||
                                           artifactId.contains("reliable-recipe-viewer") ||
                                           artifactId.contains("RoughlyEnoughItems")     ||
                                           artifactId.contains("sgui")                   ||
                                           artifactId.contains("spark")

                                }

                                targets.each { dep ->
                                    dependencies.remove dep
                                }
                            }
                        }

                        licenses {
                            //noinspection GroovyAssignabilityCheck
                            license {
                                name = license
                            }
                        }

                        developers {
                            developer {
                                id = "swackyy"
                                name = modAuthorsDisplay
                            }
                        }
                    }

                    suppressPomMetadataWarningsFor "apiElements"
                    suppressPomMetadataWarningsFor "javadocElements"
                    suppressPomMetadataWarningsFor "runtimeElements"
                    suppressPomMetadataWarningsFor "sourcesElements"
                }
            }
        }

        plugins.withType(MavenPublishPlugin).configureEach {
            signing {
                String id = findProperty "secretsSigningId"
                String key = findProperty "secretsSigningKey"
                String password = findProperty "secretsSigningPassword"

                if (id && key && password) {
                    useInMemoryPgpKeys id, key, password
                    sign publishing.publications.maven
                } else {
                    System.err.println "Could not sign project ${project.name}"
                    required = false
                }
            }
        }
    }
}
